<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StreamHub — Premium</title>
  <meta name="description" content="StreamHub — premium material streaming UI (TMDB optional)">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>StreamHub</h1>
      <span class="badge">Premium</span>
    </div>
    <div class="controls">
      <div class="searchbox" role="search" aria-label="Search">
        <input id="searchInput" placeholder="Search movies & TV (press Enter)" />
        <button id="searchButton" aria-label="Search">Search</button>
      </div>
      <button id="themeBtn" title="Toggle theme">🌗</button>
    </div>
  </header>

  <main class="container">
    <section class="hero-card">
      <div class="hero-inner">
        <div class="hero-meta">
          <h2 id="heroTitle">Featured</h2>
          <p id="heroDesc">Hand-picked premium selections. Click any poster to view details, trailer or play.</p>
          <div class="hero-actions">
            <button id="heroPlayBtn">Play</button>
            <button id="heroMoreBtn">Details</button>
          </div>
        </div>
        <img id="heroPoster" class="hero-poster" alt="featured poster" src="" loading="lazy" />
      </div>
    </section>

    <section id="rows" aria-live="polite"></section>

    <section id="searchArea" class="card-section" hidden>
      <div class="row-title"><h3>Search results</h3></div>
      <div id="searchResults" class="row-grid"></div>
    </section>

    <footer class="footer">
      <div>Built with ❤️ · StreamHub Premium</div>
      <div class="small">TMDB optional — set API key in app.js</div>
    </footer>
  </main>

  <!-- Modal (minimal) -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script defer src="app.js"></script>
</body>
</html>
