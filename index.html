<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StreamHub — No-API Version</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">StreamHub</div>
    <div class="controls">
      <input id="searchInput" placeholder="Search movies & TV (type ≥ 2 chars)" />
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <main id="main">
    <section class="section">
      <h2 class="section-title">Samples</h2>
      <div id="samples" class="row-strip"></div>
    </section>

    <section class="section">
      <h2 class="section-title">Search Results</h2>
      <div id="results" class="row-strip"></div>
    </section>
  </main>

  <!-- Player modal -->
  <div id="playerModal" class="modal hidden">
    <div class="modal-card">
      <button id="closePlayer" class="close">✕</button>
      <h3 id="playerTitle">Player</h3>

      <div id="tvControls" class="tv-controls hidden">
        Season <input id="seasonInput" type="number" min="1" value="1" />
        Episode <input id="episodeInput" type="number" min="1" value="1" />
        <button id="loadEpisodeBtn">Load</button>
      </div>

      <iframe id="playerFrame" allowfullscreen referrerpolicy="no-referrer"></iframe>

      <div style="display:flex;gap:8px;margin-top:10px;">
        <button id="nextEpBtn" class="secondary hidden">Next Episode ⏭</button>
        <button id="copyUrl" class="secondary">Copy Embed URL</button>
      </div>

      <pre id="debugLog" class="debug"></pre>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
