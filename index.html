<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamHub V2 Fixed</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="header">
    <h1 class="logo">StreamHub</h1>
    <input id="searchInput" class="search" placeholder="Search movies or series..." />
</header>

<main id="content"></main>

<!-- PLAYER MODAL -->
<div id="playerModal" class="modal hidden">
    <div class="modal-box">
        <span id="closePlayer" class="close">&times;</span>
        <iframe id="playerFrame" allowfullscreen></iframe>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
