<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamHub V6</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="nav">
  <h1 class="logo">StreamHub<span>V6</span></h1>
  <input id="searchInput" class="search" placeholder="Search by title..." oninput="searchMovies()" />
</header>

<section id="results" class="results"></section>

<!-- PLAYER MODAL -->
<div id="playerModal" class="player-modal">
    <div class="player-box">
        <button class="close-btn" onclick="closePlayer()">✕</button>
        <iframe id="playerFrame" allowfullscreen frameborder="0" referrerpolicy="no-referrer"></iframe>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
