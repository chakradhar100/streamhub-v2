    <section id="popular-movies-section">
        <h2>Popular Movies</h2>
        <div id="popular-movies" class="grid-container"></div>

    <section id="popular-tv-section">
        <h2>Popular TV Shows</h2>
        <div id="popular-tv" class="grid-container"></div>
    </section>

    <section id="search-results-section">
        <h2>Search Results</h2>
        <div id="search-results" class="grid-container"></div>
    </section>

        <h2>Player</h2>
        <div id="player"></div>
