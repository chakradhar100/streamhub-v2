<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub V9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎬 StreamHub V9</h1>
    <div class="search-box">
        <input id="searchInput" type="text" placeholder="Search movie or series...">
        <button onclick="searchMovie()">Search</button>
    </div>
</header>

<div id="results" class="grid"></div>

<!-- Player Modal -->
<div id="playerModal" class="modal hidden">
    <div class="modal-content">
        <span class="close" onclick="closePlayer()">&times;</span>

        <h2 id="playerTitle"></h2>

        <div id="episodeControls" class="episode-controls hidden">
            <label>Season:</label>
            <input type="number" id="seasonInput" min="1" value="1">

            <label>Episode:</label>
            <input type="number" id="episodeInput" min="1" value="1">

            <button onclick="updateEpisode()">Load</button>
        </div>

        <iframe id="playerFrame" allowfullscreen></iframe>

        <button id="nextBtn" class="next-btn hidden" onclick="nextEpisode()">Next Episode ⏭</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
