<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StreamHub Player</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:Inter,system-ui,Arial}
    .topbar{display:flex;align-items:center;background:#0c0c0c;padding:12px 16px;position:sticky;top:0;z-index:20}
    .back-btn{background:#ff6a2b;color:#fff;padding:8px 14px;border:none;border-radius:6px;cursor:pointer;margin-right:12px}
    .player-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:18px;gap:18px}
    .player-frame{width:min(1100px,98%);height:640px;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    #meta{max-width:1100px;width:98%;color:#9fb3d9;padding-left:4px}
    .small{font-size:13px;color:#9fb3d9}
    @media (max-width:860px){ .player-frame{height:360px} }
    .load-btn{background:#ff6a2b;border:0;padding:12px 18px;color:#fff;border-radius:8px;font-weight:700;cursor:pointer}
    .info-url{margin-top:12px;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;word-break:break-all;color:#cfe1ff}
    .mirror-list{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
    .mirror-list a{background:#1b2a3a;color:#fff;padding:6px 10px;border-radius:8px;text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>
    <div style="font-size:16px;opacity:.8;">StreamHub Player</div>
  </div>

  <div class="player-wrap">
    <div id="meta" class="meta"></div>
    <div id="frame" class="player-frame">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;">
        <div style="margin-bottom:12px;color:#9fb3d9">Player ready — click to load.</div>
        <button id="loadBtn" class="load-btn">▶ Load Player</button>
      </div>
    </div>
    <div id="urlInfo" class="info-url" style="display:none"></div>
    <div id="mirrorArea" class="mirror-list" style="display:none"></div>
    <div class="small">If embed fails, click the URL shown above or try a mirror.</div>
  </div>

<script>
  function qp() { const u = new URL(window.location.href); const p = {}; for (const [k,v] of u.searchParams.entries()) p[k]=v; return p; }
  const params = qp();
  const imdb = params.imdb;
  const type = params.type || 'movie';
  const s = params.s;
  const e = params.e;
  const embedParam = params.embed; // direct embed URL (used by overlay maximize)
  const frame = document.getElementById('frame');
  const meta = document.getElementById('meta');
  const urlInfo = document.getElementById('urlInfo');
  const mirrorArea = document.getElementById('mirrorArea');
  const loadBtn = document.getElementById('loadBtn');

  meta.innerHTML = `<strong>Embed:</strong> ${embedParam ? 'Direct embed' : (imdb ? imdb : 'none')} <span class="small">&nbsp;• ${type.toUpperCase()} ${s?`• S${s}`:''} ${e?`• E${e}`:''}</span>`;

  const primarySrc = embedParam ? embedParam : (imdb ? (type === 'tv' ? `https://vidsrc-embed.ru/embed/tv?imdb=${encodeURIComponent(imdb)}&s=${encodeURIComponent(s||1)}&e=${encodeURIComponent(e||1)}` : `https://vidsrc-embed.ru/embed/movie?imdb=${encodeURIComponent(imdb)}`) : '');

  const mirrors = imdb ? [
    primarySrc,
    `https://vidsrc.me/embed/${type === 'tv' ? 'tv' : 'movie'}?imdb=${encodeURIComponent(imdb)}${type==='tv'?`&s=${encodeURIComponent(s||1)}&e=${encodeURIComponent(e||1)}`:''}`,
    `https://vidsrc.to/embed/${type === 'tv' ? 'tv' : 'movie'}?imdb=${encodeURIComponent(imdb)}${type==='tv'?`&s=${encodeURIComponent(s||1)}&e=${encodeURIComponent(e||1)}`:''}`
  ] : (embedParam ? [embedParam] : []);

  loadBtn.onclick = function() {
    if (!primarySrc) { frame.innerHTML = '<div style="padding:20px;color:#f88">No player URL.</div>'; return; }
    frame.innerHTML = `<iframe src="${primarySrc}" frameborder="0" width="100%" height="100%" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
    setTimeout(()=> revealURL(primarySrc), 500);
  };

  setTimeout(()=> revealURL(primarySrc), 5000);

  function revealURL(url) {
    if (!url) return;
    urlInfo.style.display = 'block';
    urlInfo.innerHTML = `<strong>Embed URL used:</strong><br><a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
    mirrorArea.style.display = 'flex';
    mirrorArea.innerHTML = '';
    mirrors.forEach(m => {
      const a = document.createElement('a'); a.href = m; a.target = '_blank'; a.rel='noopener noreferrer'; a.textContent = 'Open mirror';
      mirrorArea.appendChild(a);
    });
  }
</script>
</body>
</html>
